[package]
name = "wasm-kaspa"
version = "0.1.0"
edition = "2021"
description = "Kaspa WASM bindings for atomic swaps"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
hex = "0.4"
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "covpp-reset2" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "covpp-reset2" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "covpp-reset2" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", branch = "covpp-reset2" }
secp256k1 = { version = "0.28", features = ["recovery"] }
oorandom = "11.1"
console_error_panic_hook = "0.1"
once_cell = "1.19"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
]

[profile.release]
opt-level = "s"
lto = true
